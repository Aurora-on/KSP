[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mun-lander-sim"
version = "0.1.0"
description = "Six degree of freedom Mun landing simulator for world-model pretraining"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=1.24", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
demo = ["matplotlib>=3.7", "pillow>=9"]

[project.scripts]
mun-lander = "mun_lander.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

