[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mun-agent"
version = "0.1.0"
description = "World model and policy training for the Mun landing simulator"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.4",
    "gymnasium==1.4.0",
    "torch==2.15.0",
    "mun-lander-sim==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
mun-agent = "mun_agent.cli:main"
