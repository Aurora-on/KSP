name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostic-rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q ksp_env scripts tests
      - name: Test offline readiness rules
        run: python -m unittest discover -s tests -v
      # Scientific packages and a live KSP installation are validated locally.

  simulator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install simulator test dependencies
        run: python -m pip install -e './simulator[dev]'
      - name: Test source simulator without KSP
        run: python -m pytest simulator/tests -q

  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -c requirements/runtime.txt torch
      - name: Install simulator and agent
        run: |
          python -m pip install -c requirements/runtime.txt -e ./simulator -e './agent[dev]'
          python -m pip check
      - name: Test agent on CPU
        run: python -m pytest agent/tests -q
