# Mun landing task contract.
# Qualitative decisions follow KSP_World_Model_Proposal_final.pptx
# (reviewed 2026-11-17). Numeric choices marked "TBD" are deliberately
# unset; this is not a runnable or validated environment yet.
# 2026-11-25 team decision: see docs/nominal-task-decisions.md.
status = "nominal_task_numbers_frozen_craft_and_site_pending"
task = "powered_descent"
target_body = "Mun"
initial_state_ready = false
success_thresholds_ready = false
reset_step_validated = false

[connection]
address = "127.0.0.1"
rpc_port = 50000
stream_port = 50001
client_version = "0.7.0"
server_version = "0.7.0"
game_version = "1.12.5"

[scenario]
# Nominal condition. Physical OOD variants are listed under [evaluation].
site = "flat"
gravity = "fixed_nominal"
craft = "fixed_nominal"
save_name = "TBD"  # named descent save; required by reset
randomize_initial = ["position", "velocity", "attitude", "angular_velocity"]
# Local vertical clearance at reset, uniformly distributed.
descent_altitude_m = [80.0, 120.0]
target_position = "TBD"
initial_position_range = { x_m = [-30.0, 30.0], y_m = [-30.0, 30.0], horizontal_sampling = "independent_uniform" }
initial_velocity_range = { x_m_s = [-2.0, 2.0], y_m_s = [-2.0, 2.0], z_m_s = [-8.0, -3.0], sampling = "independent_uniform_z_up" }
initial_attitude_range = { max_tilt_deg = 12.0, thrust_axis_sampling = "uniform_solid_angle", yaw_sampling = "uniform_full_turn" }
initial_angular_velocity_range = { max_norm_rad_s = 0.05, sampling = "uniform_ball" }
control_hz = 10.0
episode_horizon_s = 90.0

[observation]
fields = [
  "position",
  "velocity",
  "attitude_quaternion",
  "angular_velocity",
  "main_engine_fuel",
]
frame = "TBD"  # target-relative surface frame; define before adapter implementation
units = "SI"
normalization = "TBD"
main_engine_fuel_resource = "TBD"  # craft-specific resource name; unit/normalization TBD
body_to_task_rotation_xyzw = "TBD"  # fixed KSP body -> task body rotation
diagnostic_only_fields = ["mass", "inertia_tensor"]

[action]
fields = ["rcs_pitch", "rcs_yaw", "rcs_roll", "main_engine_throttle"]
rcs_semantics = "TBD"  # torque command vs normalized input
throttle_range = [0.0, 1.0]
autopilot_inner_loop = false

[safety]
# Thresholds are frozen. KSP event and measurement validation is pending.
stable_window_s = 5.0
max_touchdown_speed_m_s = 2.0
max_touchdown_tilt_deg = 10.0
max_touchdown_angular_velocity_deg_s = 11.459155902616466  # 0.2 rad/s
target_radius_m = 5.0

[failure]
count_as_failure = ["crash", "timeout", "fuel_exhaustion_abort"]
# Connection, reset and tick failures are infrastructure errors, not landing outcomes.
infrastructure_errors = ["connection_loss", "reset_failure", "tick_timeout"]

[metrics]
safe_landing_rate = "safe_landings / all_attempts"
precision_rate = "attempts_within_target_radius / all_attempts"
landing_error = "surface_tangent_plane_distance; summarize over safe landings"
propellant_consumed = "total mass consumed; report main-engine and RCS breakdown on safe landings"

[data]
# Imagined transitions are never counted as KSP data.
budget_counters = [
  "ksp_train_transitions",
  "ksp_evaluation_transitions",
  "simulation_seconds",
  "resets",
  "wall_seconds",
  "policy_updates",
  "model_updates",
  "gpu_hours",
]
imagination_is_not_ksp_data = true
splits = ["adaptation", "validation", "test"]

[experiment]
design = "2x2_pretraining_by_imagination"
groups = ["A", "B", "C", "D"]
# Learning-curve checkpoint threshold, not the touchdown safety criterion.
validation_success_threshold = 0.80
min_training_seeds = 3
matched_factors = [
  "observation",
  "action",
  "reward",
  "model_capacity",
  "policy_updates",
  "ksp_budget",
  "evaluation_set",
]
# Exact N_sim, N_KSP, seed count, model architecture and compute budget remain TBD.

[evaluation]
metrics = ["safe_landing_rate", "precision_rate", "landing_error", "propellant_consumed"]
ood_axes = ["mass", "inertia", "thrust", "gravity"]
ood_protocol = "one_axis_at_a_time"
ood_ranges = "TBD"
freeze_during_ood_evaluation = true
evaluate_in = ["fast_simulator", "ksp"]
rq2_identical_ksp_dataset = true

[implementation]
# Still implementation recommendations unless a later decision record says otherwise.
dynamics = "rigid_body_6dof"
# Core adapter follows Gymnasium semantics but does not require the gymnasium
# package; a thin gym.Env wrapper is deferred until reward and spaces are fixed.
step_api = "gymnasium_compatible_core"
time_source = "simulation_ut"
reset_strategy = "named_snapshot_and_readback"
