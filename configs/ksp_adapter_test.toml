# Adapter test profile. This is NOT the Mun landing task contract.
#
# It exists only to exercise the live KSP adapter on the local launchpad save:
# connection, observation assembly, one fixed control interval and named-save
# reset. The readiness flags stay false and none of these values are task
# decisions.
status = "adapter_test_only"
task = "transport_adapter_test"
target_body = "Kerbin"
initial_state_ready = false
success_thresholds_ready = false
reset_step_validated = false

[connection]
address = "127.0.0.1"
rpc_port = 50000
stream_port = 50001
client_version = "0.7.0"
server_version = "0.7.0"
game_version = "1.12.5"

[scenario]
# Local Kerbin launchpad test. kRPC's SpaceCenter.load expects the save file
# name within the current save folder, not the folder name. This machine is in
# the "Munar landing" save folder, so "persistent" loads its persistent.sfs.
site = "launchpad"
gravity = "kerbin_nominal"
craft = "local_launchpad_test_vessel"
save_name = "persistent"
randomize_initial = []
descent_altitude_m = 0.0
target_position = [-0.09720771, -74.55767510, 0.0]
initial_position_range = "fixed_test_reset"
initial_velocity_range = "fixed_test_reset"
initial_attitude_range = "fixed_test_reset"
control_hz = 50.0  # one 0.02 s KSP physics tick per step, test only
episode_horizon_s = 10.0

[observation]
fields = [
  "position",
  "velocity",
  "attitude_quaternion",
  "angular_velocity",
  "main_engine_fuel",
]
frame = "target_surface"
units = "SI"
normalization = "none_test_only"
main_engine_fuel_resources = ["LiquidFuel"]
# Test-only fixed KSP body -> task body rotation.  This mapping sends the
# KSP vessel +Y axis to task +Z; the final craft mapping remains TBD.
body_to_task_rotation_xyzw = [0.7071067811865476, 0.0, 0.0, 0.7071067811865476]

[action]
fields = ["rcs_pitch", "rcs_yaw", "rcs_roll", "main_engine_throttle"]
rcs_semantics = "normalized_input"
throttle_range = [0.0, 1.0]
autopilot_inner_loop = false

[safety]
# Test-only copy of the frozen task limits. This profile does not validate a
# landing and the readiness flags stay false.
stable_window_s = 5.0
max_touchdown_speed_m_s = 2.0
max_touchdown_tilt_deg = 10.0
max_touchdown_angular_velocity_deg_s = 11.459155902616466  # 0.2 rad/s
target_radius_m = 5.0

[implementation]
dynamics = "rigid_body_6dof"
step_api = "gymnasium_compatible_core"
time_source = "simulation_ut"
reset_strategy = "named_snapshot_and_readback"
